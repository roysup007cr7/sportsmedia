server:
  port: 8080

spring:
  application:
    name: sportsmedia
  datasource:
    # Local/dev default = file-based H2 so you can run with zero setup.
    # On Render/Railway set DB_URL to your Postgres/MySQL URL.
    # Switch to MySQL by exporting DB_URL / DB_USER / DB_PASS (see below).
    url: ${DB_URL:jdbc:h2:file:./data/sportsmedia;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

# ---- MySQL example (production) ----
# DB_URL=jdbc:mysql://localhost:3306/sportsmedia?useSSL=false&serverTimezone=UTC
# DB_USER=root
# DB_PASS=yourpassword

app:
  jwt:
    # CHANGE THIS before going live. Must be at least 32 characters.
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-min-32-chars}
    expiry-hours: 12
  admin:
    # First boot creates this admin account, then never touches it again.
    username: ${ADMIN_USER:supriyo}
    password: ${ADMIN_PASS:Admin@12345}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://*.vercel.app}

football:
  api:
    # Free key from https://www.football-data.org/client/register
    enabled: ${FOOTBALL_API_ENABLED:false}
    token: ${FOOTBALL_API_TOKEN:}
    base-url: https://api.football-data.org/v4
    # PD=LaLiga, CL=Champions League, PL=Premier League, SA=Serie A, BL1=Bundesliga
    competitions: PD,CL,PL,SA,BL1
    days-ahead: 14
    # Runs every 30 minutes
    cron: "0 */30 * * * *"
